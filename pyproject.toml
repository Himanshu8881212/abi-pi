[project]
name = "abi-pi"
version = "1.2.6"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44,<47",
]

[dependency-groups]
dev = ["duckdb", "jsonschema", "pytest"]  # tests only (scenario 1 checks ABI's figures against DuckDB by hand)

[tool.pytest.ini_options]
markers = ["live: drives GPT-6.1 Sol through Pi (ABI_PI_LIVE=1)"]
