# A tag v1.2.3 publishes ghcr.io/<owner>/abi:1.2.3 and :latest for amd64 and arm64 (docker compose pull uses it),
# once the offline tests (test.yml) pass on that commit.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  tests:
    uses: ./.github/workflows/test.yml
  image:
    needs: tests
    runs-on: ubuntu-24.04  # as test.yml
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/abi" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }},${{ steps.tag.outputs.image }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
