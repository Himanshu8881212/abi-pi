# The image built for linux/arm64 on an arm64 machine and started as a stranger would: healthy, sign-in, a small
# CSV uploaded through the app loads exact, a PDF export and a video render, PID 1 is tini and the user is abi. release.yml
# publishes arm64 too; this is the only place one is started. Run it by hand (Actions › image › Run workflow), and it
# runs on a release branch's push that changes the image.
name: image
on:
  workflow_dispatch:
  push:  # a release branch that changes the image (a dispatch works only from the default branch)
    branches: ["release-*"]
    paths: [Dockerfile, .dockerignore, .github/workflows/image.yml, scripts/video/package*.json, engine/backend/uv.lock]
permissions:
  contents: read
jobs:
  arm64:
    runs-on: ubuntu-24.04-arm  # GitHub's free arm64 runner for public repositories
    timeout-minutes: 90
    env:
      IMAGE: abi-arm:check
      C: abi-arm
      PORT: "8790"
    steps:
      - uses: actions/checkout@v7
      - name: Build the default image for linux/arm64
        run: |
          docker build --target default -t "$IMAGE" .
          docker image inspect --format '{{.Os}}/{{.Architecture}} {{.Size}} bytes' "$IMAGE"
          [ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/arm64 ]
      - name: Start it and check it
        run: bash tests/image_check.sh
      - if: failure()
        run: |
          docker logs "$C" 2>&1 | tail -200
          docker exec "$C" sh -c 'tail -n 50 /data/logs/*.log' || true
